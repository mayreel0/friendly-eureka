<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lechigo guest fallback visual smoke</title>
    <style>
      :root {
        color: #18212f;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      body {
        margin: 0;
        background: #f6f8fb;
      }

      main {
        display: grid;
        gap: 16px;
        margin: 0 auto;
        max-width: 960px;
        padding: 24px;
      }

      [data-visual-smoke-root] {
        display: grid;
        gap: 16px;
      }

      [data-visual-smoke-case] {
        background: #ffffff;
        border: 1px solid #d7deea;
        border-radius: 8px;
        padding: 16px;
      }

      [data-visual-smoke-result] {
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Guest fallback visual smoke</h1>
      <p data-visual-smoke-result="pending">pending</p>
      <div data-visual-smoke-root></div>
    </main>
    <script type="module" src="./src/entry/visual-smoke.ts"></script>
  </body>
</html>
